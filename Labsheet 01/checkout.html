<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YourStore - Checkout</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

<header>
    <div class="logo">YourStore</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="cart.html">
            Cart
            <span id="cart-count">0</span>
        </a>
    </nav>
</header>

<main>

    <section class="checkout-section">

        <div class="checkout-box">

            <h1>Checkout</h1>
            <p class="section-subtitle">
                Enter your details to complete your order.
            </p>

            <form id="checkout-form">

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required>
                </div>

                <div class="form-group">
                    <label for="address">Address</label>
                    <textarea
                        id="address"
                        name="address"
                        rows="4"
                        placeholder="Enter your complete address"
                        required></textarea>
                </div>

                <div class="form-row">

                    <div class="form-group">
                        <label for="city">City</label>
                        <input
                            type="text"
                            id="city"
                            name="city"
                            placeholder="Enter city"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="pincode">Pincode</label>
                        <input
                            type="text"
                            id="pincode"
                            name="pincode"
                            placeholder="Enter pincode"
                            required>
                    </div>

                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter phone number"
                        required>
                </div>

                <div class="form-group">

                    <label>Payment Method</label>

                    <div class="payment-options">

                        <label>
                            <input
                                type="radio"
                                name="payment"
                                value="cod"
                                required>
                            Cash on Delivery
                        </label>

                        <label>
                            <input
                                type="radio"
                                name="payment"
                                value="upi">
                            UPI
                        </label>

                        <label>
                            <input
                                type="radio"
                                name="payment"
                                value="card">
                            Credit / Debit Card
                        </label>

                    </div>

                </div>

                <button type="submit" class="btn order-btn">
                    Place Order
                </button>
                <div
                    id="confirmation"
                    style="display: none;">
                </div>

            </form>

        </div>

    </section>

</main>

<footer>
    <p>© 2026 YourStore. All Rights Reserved.</p>
    <p>Email: support@yourstore.com | Phone: +91 98765 43210</p>
</footer>

</body>
</html>
